<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lift Focus</title>
  <style>
    :root {
      --text: #1c1c1e;
      --muted: #6b6b70;
      --bg: #f7f6f3;
      --link: #1a5f4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.55;
      color: var(--text);
      background: var(--bg);
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }
    p { margin: 0 0 1.25rem; color: var(--muted); }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li { margin: 0 0 0.75rem; }
    a {
      color: var(--link);
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Lift Focus</h1>
    <p>An iOS workout tracker. Plans and history stay on your device.</p>
    <ul>
      <li><a href="support.html">Support</a></li>
      <li><a href="privacy.html">Privacy Policy</a></li>
    </ul>
  </main>
</body>
</html>
